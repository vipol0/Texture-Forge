[package]
name = "texture-forge"
version = "0.1.0"
edition = "2021"
description = "A lightweight texture stylizer with before/after preview"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
gltf = { version = "1.4", default-features = false, features = ["import", "utils", "KHR_texture_transform"] }
quantette = "0.6"
rayon = "1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tobj = "4"
ufbx = "0.11"

# Linux/BSD use the native windowing backends.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

# Windows and macOS use their native backends (no x11/wayland).
[target.'cfg(not(all(unix, not(target_os = "macos"))))'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
